<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <style>
        /* --- Estilos Globales --- */
        body {
            margin: 0;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', sans-serif;
            background-color: #f4f7f6;
        }

        /* --- Estructura del Chat --- */
        .contenedor-chat {
            display: flex;
            flex-direction: column;
            height: 100vh; /* Ocupa 100% del iframe */
            width: 100vw;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* --- Cabecera --- */
        .cabecera {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background-color: #fef5e7; /* Color durazno */
            border-bottom: 1px solid #eee;
        }
        .cabecera img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .info-cabecera .titulo {
            display: block;
            font-weight: 700;
            font-size: 16px;
        }
        .info-cabecera .subtitulo {
            display: block;
            font-size: 13px;
            color: #555;
        }

        /* --- Cuerpo de Mensajes --- */
        .mensajes {
            flex-grow: 1; /* Ocupa todo el espacio */
            overflow-y: auto;
            padding: 20px;
            background-color: #f4f7f6; /* Fondo beige claro */
        }

        /* --- Mensajes del Bot --- */
        .mensaje-bot {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            max-width: 85%;
        }
        .avatar-bot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .burbuja-bot {
            background-color: #ececef; /* Color gris claro */
            color: #333;
            padding: 12px 15px;
            border-radius: 18px;
            border-top-left-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* --- Mensajes del Usuario --- */
        .mensaje-usuario {
            display: flex;
            justify-content: flex-end; /* Alinea a la derecha */
            margin-bottom: 15px;
        }
        .burbuja-usuario {
            background-color: #0d6efd; /* Color azul */
            color: white;
            padding: 12px 15px;
            border-radius: 18px;
            border-top-right-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }
        
        /* --- Entrada de Texto (Footer) --- */
        .entrada {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            background-color: #ffffff;
        }
        /* Corregido a 'inputmensaje' (minúscula) */
        #inputmensaje {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 14px;
            margin-right: 10px;
        }
        #botonEnviar {
            padding: 10px 20px;
            background-color: #0d6efd; /* Azul */
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        #botonEnviar:disabled {
            background-color: #a0a0a0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="contenedor-chat">
        <header class="cabecera">
            <img
             src="https://img.freepik.com/vector-gratis/vectorart-conversacion-chatbot_78370-4107.jpg?semt=ais_hybrid&w=740&q=80" 
             alt="logo">
            <div class="info-cabecera">
                <span class="titulo">LIA FINANCE</span>
                <span class="subtitulo">Asistente virtual</span>
            </div>    
        </header>
            
        <main class="mensajes" id="cuerpoChat">
            <div class="mensaje-bot">
                 <img 
                  src="https://img.freepik.com/vector-gratis/vectorart-conversacion-chatbot_78370-4107.jpg?semt=ais_hybrid&w=740&q=80" 
                  alt="avatar" 
                  class="avatar-bot" 
                 />
                 <div class="burbuja-bot">👋 ¡Hola! Soy Lia. Escribe <code>/listar</code> para ver servicios.</div>
            </div>
        </main>
            
        <footer class="entrada">
            <input type="text" placeholder="Escribe tu mensaje..." id="inputmensaje"/>
            <button id="botonEnviar" disabled>Enviar</button>
        </footer>
    </div>
    
    <script>
        // --- Todo tu 'chat.js' va aquí ---

        const input = document.getElementById('inputmensaje');
        const boton1 = document.getElementById('botonEnviar');
        const cuerpo = document.getElementById('cuerpoChat');

       // (Aquí pegué tu código de 'servicios' y 'planes')
const servicios = {
    "001": {
        id: "001",
        nombre: "Asesoría Personalizada",
        descripcion: "Servicio experto. Precio: $20.00",
        img: "asesoria.png" // Tu imagen
    },
    "002": {
        id: "002",
        nombre: "Plantilla de Gastos",
        descripcion: "Organiza tus finanzas. Precio: $15.00",
        img: "plantilla.png" // Tu imagen
    }
};
        let estadoContacto = null;
        let leadActual = { nombre: "", correo: "", numero: "" };

        // (Aquí pegué tus funciones)
        input.addEventListener('input', () => {
            const activo = input.value.trim() !== '';
            boton1.disabled = !activo;
            boton1.style.opacity = activo ? '1' : '0.6';
            boton1.style.cursor = activo ? 'pointer' : 'not-allowed';
        });
        boton1.addEventListener('click', enviarMensaje);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') enviarMensaje();
        });

        function enviarMensaje() {
            const texto = input.value.trim();
            if (texto === '') return;
            agregarMensaje('usuario', texto);
            input.value = '';
            input.dispatchEvent(new Event('input'));
            setTimeout(() => {
                procesarRespuesta(texto);
            }, 500);
        }

        function agregarMensaje(tipo, contenidoHTML) {
            const mensaje = document.createElement('div');
            if (tipo === 'bot') {
                mensaje.className = 'mensaje-bot';
                const avatar = document.createElement('img');
                avatar.src = "https://img.freepik.com/vector-gratis/vectorart-conversacion-chatbot_78370-4107.jpg?semt=ais_hybrid&w=740&q=80";
                avatar.className = 'avatar-bot';
                const burbuja = document.createElement('div');
                burbuja.className = 'burbuja-bot';
                burbuja.innerHTML = contenidoHTML;
                mensaje.appendChild(avatar);
                mensaje.appendChild(burbuja);
            } else if (tipo === 'usuario') {
                mensaje.className = 'mensaje-usuario';
                const burbuja = document.createElement('div');
                burbuja.className = 'burbuja-usuario';
                burbuja.innerHTML = contenidoHTML;
                mensaje.appendChild(burbuja);
            }
            cuerpo.appendChild(mensaje);
            cuerpo.scrollTop = cuerpo.scrollHeight;
        }

        function procesarRespuesta(texto) {
            const mensaje = texto.toLowerCase();
            if (mensaje === "/listar") {
                let respuesta = "<strong>📋 Servicios de Data Risk:</strong><br>";
                for (const id in servicios) {
                    const s = servicios[id];
                    respuesta += `<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;"><img src="${s.img}" alt="${s.nombre}" style="width:40px;height:40px;object-fit:contain;"><div><strong>${s.nombre}</strong><br><span style="font-size:13px; color:#333;">${s.descripcion}</span></div></div>`;
                }
                respuesta += `<br>💬 Usa <code>/planes</code> para conocer nuestros planes de suscripción.`;
                agregarMensaje('bot', respuesta);
                return;
            }
            
            if (mensaje === "/contacto") {
                estadoContacto = "pidiendo_nombre";
                leadActual = { nombre: "", correo: "", numero: "" };
                agregarMensaje('bot', "📋 Perfecto, puedo ayudarte con eso. ¿Podrías indicarme tu <strong>nombre completo</strong>");
                return;
            }
            if (estadoContacto === "pidiendo_nombre") {
                leadActual.nombre = texto.trim();
                estadoContacto = "pidiendo_correo";
                agregarMensaje('bot', `Gracias, ${leadActual.nombre}. ¿Cuál es tu <strong>correo electrónico</strong>?`);
                return;
            }
            if (estadoContacto === "pidiendo_correo") {
                leadActual.correo = texto.trim();
                estadoContacto = "pidiendo_numero";
                agregarMensaje('bot', `Perfecto. Ahora, ¿podrías indicarme tu <strong>número de contacto</strong>?`);
                return;
            }
            if (estadoContacto === "pidiendo_numero") {
                leadActual.numero = texto.trim();
                estadoContacto = null;
                agregarMensaje('bot', `✅Gracias por tu interés, ${leadActual.nombre}!<br><br>He registrado tus datos:<br>•✉️<strong>Correo:</strong> ${leadActual.correo}<br>•📱<strong>Número:</strong> ${leadActual.numero}<br><br>Nuestro equipo se pondrá en contacto contigo pronto.`);
                const leadsGuardados = JSON.parse(localStorage.getItem("leads")) || [];
                leadsGuardados.push(leadActual);
                localStorage.setItem("leads", JSON.stringify(leadsGuardados));
                return;
            }
            agregarMensaje('bot', generarRespuestaSimulada(mensaje));
        }

        function generarRespuestaSimulada(mensaje) {
            if (mensaje.includes('hola') || mensaje.includes('buenas')) {
                return '¡Hola! Estoy aquí para ayudarte. Puedes escribir "/listar" para ver nuestros servicios.';
            } else if (mensaje.includes('precio') || mensaje.includes('costo')) {
                return 'Por favor, indica el nombre o ID del producto para darte su precio.';
            } else if (mensaje.includes('gracias')) {
                return '¡Con gusto! Si tienes más dudas, estoy disponible.';
            } else {
                return 'Lo siento, aún estoy en entrenamiento. Puedes escribir "/listar" o preguntar por un producto específico.';
            }
        }
    </script>

</body>
</html>
